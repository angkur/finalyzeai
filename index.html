<html lang="en">
  <head>

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    
    <!-- Primary Meta Tags -->
    <title>AI Predict - Advanced AI-Powered Financial Analysis & Predictions</title>
    <meta name="title" content="AI Predict - Advanced AI-Powered Financial Analysis & Predictions" />
    <meta name="description" content="Harness the power of AI for financial predictions, market analysis, and data-driven insights. Get accurate forecasts and optimize your investment strategy with AI Predict." />

    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://aipredict.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />

    <meta property="og:site_name" content="AI Predict" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://aipredict.app/" />
    <meta name="twitter:title" content="AI Predict - AI-Powered Financial Analysis" />
    <meta name="twitter:description" content="Harness the power of AI for financial predictions and data-driven insights." />
    <meta name="twitter:image" content="https://aipredict.app/og-image.png" />

    <!-- Additional SEO -->
    <meta name="theme-color" content="#6366f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "AI Predict",
      "url": "https://aipredict.app",
      "logo": "https://aipredict.app/logo.png",
      "description": "Advanced AI-powered financial analysis and prediction platform",
      "sameAs": [
        "https://twitter.com/AIPredict",
        "https://linkedin.com/company/aipredict"
      ]
    }
    </script>

    <!-- Structured Data - WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "AI Predict",
      "url": "https://aipredict.app",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web Browser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "description": "AI-powered financial analysis and prediction tool for investors and traders"
    }
    </script>

    <!-- Structured Data - FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is AI Predict?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "AI Predict is an advanced AI-powered platform that provides financial analysis, market predictions, and data-driven insights for investors and traders."
          }
        },
        {
          "@type": "Question",
          "name": "How accurate are AI Predict's predictions?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Our AI models are continuously trained on the latest market data and use advanced machine learning algorithms to provide accurate predictions. However, all financial predictions should be used as one of many factors in your investment decisions."
          }
        }
      ]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
