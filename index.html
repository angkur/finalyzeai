<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png?v=2" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/favicon.png?v=2" />
    
    <!-- Primary Meta Tags -->
    <title>FinalyzeAI - AI Financial Analysis Platform</title>
    <meta name="title" content="FinalyzeAI - AI Financial Analysis Platform" />
    <meta name="description" content="Analyze financial documents, cash flow, ratios, forecasts, and fraud risks with FinalyzeAI's AI Predict tools and finance guides." />
    <meta name="keywords" content="FinalyzeAI, AI Predict, financial analysis, financial forecasting, cash flow analysis, fraud detection, document intelligence" />
    <meta name="author" content="FinalyzeAI" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://finalyzeai.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://finalyzeai.com/" />
    <meta property="og:title" content="FinalyzeAI - AI Financial Analysis Platform" />
    <meta property="og:description" content="Use AI Predict to analyze statements, forecasts, cash flow, and fraud risks with practical finance education from FinalyzeAI." />
    <meta property="og:image" content="https://finalyzeai.com/logo.png" />
    <meta property="og:site_name" content="FinalyzeAI" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://finalyzeai.com/" />
    <meta name="twitter:title" content="FinalyzeAI - AI Financial Analysis" />
    <meta name="twitter:description" content="AI Predict tools and finance guides for document analysis, forecasting, ratios, and risk review." />
    <meta name="twitter:image" content="https://finalyzeai.com/logo.png" />
    <meta name="twitter:site" content="@FinalyzeAI" />

    <!-- Google AdSense account verification (script loaded only on content pages via useAdSense hook) -->
    <meta name="google-adsense-account" content="ca-pub-8410008511726740" />

    <!-- Additional SEO -->
    <meta name="theme-color" content="#6366f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "FinalyzeAI",
      "url": "https://finalyzeai.com",
      "logo": "https://finalyzeai.com/logo.png",
      "description": "AI-powered financial analysis, document intelligence, forecasting, and fraud detection platform",
      "sameAs": [
        "https://www.linkedin.com/company/finalyzeai/"
      ]
    }
    </script>

    <!-- Structured Data - WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "FinalyzeAI",
      "url": "https://finalyzeai.com",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web Browser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "description": "AI-powered financial analysis platform for financial document review, forecasting, fraud detection, and business intelligence"
    }
    </script>

    <!-- Structured Data - FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is FinalyzeAI?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "FinalyzeAI is an AI-powered platform for financial document analysis, forecasting, cash-flow review, ratio analysis, fraud risk detection, and finance education."
          }
        },
        {
          "@type": "Question",
          "name": "Does FinalyzeAI provide financial advice?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "FinalyzeAI provides analytical tools and educational finance content, not regulated financial advice. Users should verify outputs and consult qualified professionals before making decisions."
          }
        }
      ]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
